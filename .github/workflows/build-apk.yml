name: Build Gary Tracker APK

on:
  push:
    paths:
      - "gary-tracker/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: gary-tracker
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: cp gary-tracker/app/build/outputs/apk/debug/app-debug.apk gary-tracker-gary.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gary-tracker-apk
          path: gary-tracker-gary.apk
